# Configuration for Ring Bootstrap Topology — Node 1
[node]
listen_address = "127.0.0.1"
listen_port = 9001
data_dir = "./data/ring/node_1"
log_level = "info"

[dht]
k_bucket_size = 4
alpha = 3
replication = 3
ttl_seconds = 180
refresh_interval_seconds = 60

[transport]
connect_timeout_ms = 3000
rpc_timeout_ms = 2000
max_frame_payload = 65536

[bootstrap]
topology = "ring"
peers = ["127.0.0.1:9000"]
